name: Build PersistentSD

on:
  pull_request:
    branches: [main]
    paths:
      - 'PersistentSDManager.cs'
      - 'PersistentSD.ps1'
      - 'PersistentSDManager.exe.manifest'
      - 'RazorBlade.ico'
      - 'PersistentSD.png'
      - 'Build-PersistentSD.bat'
      - 'README.md'
      - 'TESTING.md'
      - 'LICENSE'
      - '.github/workflows/build-persistentsd.yml'
  push:
    branches: [main]
    paths:
      - 'PersistentSDManager.cs'
      - 'PersistentSD.ps1'
      - 'PersistentSDManager.exe.manifest'
      - 'RazorBlade.ico'
      - 'PersistentSD.png'
      - 'Build-PersistentSD.bat'
      - 'README.md'
      - 'TESTING.md'
      - 'LICENSE'
      - '.github/workflows/build-persistentsd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate PowerShell template syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'PersistentSD.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'PowerShell template contains syntax errors.'
          }
          Write-Output 'PowerShell template syntax is valid.'

      - name: Compile Windows Forms application
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          if (-not (Test-Path $csc)) { throw 'Could not find .NET Framework csc.exe.' }
          if (-not (Test-Path 'PersistentSD.ps1')) { throw 'PersistentSD.ps1 template is missing.' }
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /win32icon:RazorBlade.ico /win32manifest:PersistentSDManager.exe.manifest /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /out:PersistentSD.exe PersistentSDManager.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'PersistentSD.exe')) { throw 'Compiler reported success but EXE was not created.' }
          Get-FileHash PersistentSD.exe -Algorithm SHA256 | Format-List

      - name: Package runnable build and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item PersistentSD.exe, PersistentSD.ps1, LICENSE, README.md -Destination dist
          Compress-Archive -Path dist\* -DestinationPath PersistentSD-build.zip -Force
          if (-not (Test-Path 'PersistentSD-build.zip')) { throw 'Release ZIP was not created.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'PersistentSD-build.zip'))
          try {
            $required = @('PersistentSD.exe', 'PersistentSD.ps1', 'LICENSE', 'README.md')
            $actual = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($item in $required) {
              if ($item -notin $actual) { throw "Release ZIP is missing required file: $item" }
            }
            Write-Output "Release ZIP contents validated: $($actual -join ', ')"
          }
          finally {
            $zip.Dispose()
          }
          Get-FileHash PersistentSD-build.zip -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: PersistentSD-Windows-build
          path: PersistentSD-build.zip
          if-no-files-found: error
          retention-days: 14
